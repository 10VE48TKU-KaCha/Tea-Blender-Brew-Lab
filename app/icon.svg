<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kissaWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F17" />
      <stop offset="50%" stop-color="#1C120C" />
      <stop offset="100%" stop-color="#110A07" />
    </linearGradient>
    <linearGradient id="teaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#D98824" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="matchaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#2D7A47" />
      <stop offset="100%" stop-color="#155E32" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge Background -->
  <circle cx="60" cy="60" r="56" fill="url(#kissaWoodGrad)" stroke="url(#teaGoldGrad)" stroke-width="3" />
  
  <!-- Traditional Mon Inner Ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#D98824" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Four Cardinal Accent Dots -->
  <circle cx="60" cy="14" r="2" fill="#FCD34D" />
  <circle cx="106" cy="60" r="2" fill="#FCD34D" />
  <circle cx="60" cy="106" r="2" fill="#FCD34D" />
  <circle cx="14" cy="60" r="2" fill="#FCD34D" />

  <!-- Water Ripples -->
  <path d="M 28 86 Q 60 94 92 86" fill="none" stroke="url(#teaGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 35 78 Q 60 84 85 78" fill="none" stroke="url(#teaGoldGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />

  <!-- Left Tea Leaf (Matcha Green) -->
  <path d="M 58 68 C 42 64 30 50 36 34 C 44 42 53 53 58 68 Z" 
        fill="url(#matchaGrad)" 
        stroke="#155E32" 
        stroke-width="0.8" />
  <path d="M 56 65 Q 46 48 37 36" fill="none" stroke="#BBF7D0" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

  <!-- Right Tea Leaf (Golden Amber) -->
  <path d="M 62 68 C 78 64 90 50 84 34 C 76 42 67 53 62 68 Z" 
        fill="url(#teaGoldGrad)" 
        stroke="#9A520E" 
        stroke-width="0.8" />
  <path d="M 64 65 Q 74 48 83 36" fill="none" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

  <!-- Center Tea Shoot -->
  <path d="M 60 55 C 57 44 58 35 60 27 C 62 35 63 44 60 55 Z" 
        fill="url(#teaGoldGrad)" 
        stroke="#FCD34D" 
        stroke-width="0.6" />

  <!-- Rising Zen Steam Wisps -->
  <path d="M 53 23 Q 50 18 53 14" fill="none" stroke="#FCD34D" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
  <path d="M 60 21 Q 63 16 60 11" fill="none" stroke="#FCD34D" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
  <path d="M 67 23 Q 70 18 67 14" fill="none" stroke="#FCD34D" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
</svg>
